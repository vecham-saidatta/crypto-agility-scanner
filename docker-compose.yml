version: "3.9"

services:

  backend:
    build:
      context: ./backend
    container_name: crypto-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16

    container_name: crypto-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_scanner

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: crypto-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: